[package]
name = "km-rust-redis"
version = "0.1.0"
edition = "2021"
description = "Redis 8 reimplementation in Rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
dashmap = "6"
bytes = "1"
rand = "0.8"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
itoa = "1"
memchr = "2"
phf = { version = "0.11", features = ["macros"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies.mlua]
version = "0.10"
features = ["lua54", "vendored", "send"]

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std"]

[dependencies.rustls-pemfile]
version = "2"

[dependencies.libloading]
version = "0.8"
